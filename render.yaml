envVarGroups:
  - name: novera-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: novera-postgres
    databaseName: novera_db
    user: novera_user
    plan: free
    region: oregon

services:
  # ── Authentication Service ──────────────────────────────────────────────────
  - type: web
    name: novera-auth
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-auth-service:0.2.5
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: AUTH_DB_URL
        sync: false          # set after DB is ready  →  jdbc:postgresql://<host>:5432/novera_auth_db
      - key: POSTGRES_USER
        fromDatabase:
          name: novera-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: novera-postgres
          property: password
      - fromGroup: novera-shared

  # ── Product Service ─────────────────────────────────────────────────────────
  - type: web
    name: novera-product
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-product-service:0.2.5
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PRODUCT_DB_URL
        sync: false          # jdbc:postgresql://<host>:5432/productdb
      - key: POSTGRES_USER
        fromDatabase:
          name: novera-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: novera-postgres
          property: password
      - fromGroup: novera-shared

  # ── Cart Service ────────────────────────────────────────────────────────────
  - type: web
    name: novera-cart
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-cart-service:0.2.5
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: CART_DB_URL
        sync: false          # jdbc:postgresql://<host>:5432/novera_cart_db
      - key: PRODUCT_SERVICE_URL
        sync: false          # https://novera-product.onrender.com
      - key: POSTGRES_USER
        fromDatabase:
          name: novera-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: novera-postgres
          property: password
      - fromGroup: novera-shared

  # ── Order Service ───────────────────────────────────────────────────────────
  - type: web
    name: novera-order
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-order-service:0.2.5
    envVars:
      - key: PORT
        value: 8083
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: ORDER_DB_URL
        sync: false          # jdbc:postgresql://<host>:5432/novera_orders
      - key: AUTH_SERVICE_URL
        sync: false          # https://novera-auth.onrender.com
      - key: PRODUCT_SERVICE_URL
        sync: false          # https://novera-product.onrender.com
      - key: CART_SERVICE_URL
        sync: false          # https://novera-cart.onrender.com
      - key: POSTGRES_USER
        fromDatabase:
          name: novera-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: novera-postgres
          property: password
      - fromGroup: novera-shared

  # ── Payment Service ─────────────────────────────────────────────────────────
  - type: web
    name: novera-payment
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-payment-service:0.2.5
    envVars:
      - key: PORT
        value: 8084
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PAYMENT_DB_URL
        sync: false          # jdbc:postgresql://<host>:5432/novera_payment_db
      - key: ORDER_SERVICE_URL
        sync: false          # https://novera-order.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false          # your Razorpay key id
      - key: RAZORPAY_KEY_SECRET
        sync: false          # your Razorpay key secret
      - key: POSTGRES_USER
        fromDatabase:
          name: novera-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: novera-postgres
          property: password
      - fromGroup: novera-shared

  # ── Gateway Service (public entry point) ────────────────────────────────────
  - type: web
    name: novera-gateway
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-gateway-service:0.2.5
    envVars:
      - key: PORT
        value: 8085
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: AUTH_SERVICE_URL
        sync: false          # https://novera-auth.onrender.com
      - key: PRODUCT_SERVICE_URL
        sync: false          # https://novera-product.onrender.com
      - key: CART_SERVICE_URL
        sync: false          # https://novera-cart.onrender.com
      - key: ORDER_SERVICE_URL
        sync: false          # https://novera-order.onrender.com
      - key: PAYMENT_SERVICE_URL
        sync: false          # https://novera-payment.onrender.com
      - fromGroup: novera-shared

  # ── Frontend ────────────────────────────────────────────────────────────────
  - type: web
    name: novera-frontend
    plan: free
    region: oregon
    runtime: image
    image:
      url: docker.io/devdatir/novera-frontend:0.3.0
    envVars:
      - key: PORT
        value: 80
      - key: GATEWAY_URL
        value: https://novera-gateway.onrender.com  # update if you renamed the gateway service
