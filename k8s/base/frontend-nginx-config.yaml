apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Disable gzip so Nginx can filter text inside JS bundles
        gzip off;

        # Replace any variation of localhost
        sub_filter 'http://localhost:8085' '';
        sub_filter 'http://localhost' '';
        sub_filter_once off;
        sub_filter_types *;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Forward API traffic to Gateway inside OpenShift
        location /api/ {
            proxy_pass http://gateway-service:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }