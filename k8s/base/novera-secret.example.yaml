# Template for k8s/base/novera-secret.yaml, which is gitignored.
#
# Copy this file to novera-secret.yaml, replace the base64 values below,
# then `kubectl apply -f k8s/base/novera-secret.yaml`.
#
# Encode a value with:
#   echo -n "your-value" | base64
#
# These are the same values that go in the root .env file for Docker Compose
# (see .env.example) — just base64-encoded instead of plain text.
apiVersion: v1
kind: Secret
metadata:
  name: novera-secret
  namespace: novera
type: Opaque
data:
  # postgres password
  POSTGRES_PASSWORD: Y2hhbmdlbWU=

  # JWT signing secret — generate with: openssl rand -hex 32
  JWT_SECRET: Y2hhbmdlbWU=

  # Razorpay test key id, from https://dashboard.razorpay.com/app/keys
  RAZORPAY_KEY_ID: cnpwX3Rlc3RfY2hhbmdlbWU=

  # Razorpay test key secret
  RAZORPAY_KEY_SECRET: Y2hhbmdlbWU=
