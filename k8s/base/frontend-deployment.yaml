apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: novera

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: devdatir/novera-frontend:0.3.0

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: novera-config