apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: novera
data:
  init.sql: |
    CREATE DATABASE productdb;
    CREATE DATABASE novera_auth_db;
    CREATE DATABASE novera_cart_db;
    CREATE DATABASE novera_orders;
    CREATE DATABASE novera_payment_db;
  restore-data.sh: |
    #!/bin/bash
    # Restores the committed seed-data dumps into each database created by init.sql.
    # Runs automatically on first container init (docker-entrypoint-initdb.d),
    # after init.sql since "init.sql" sorts before "restore-data.sh".
    set -e
    
    for f in /docker-entrypoint-initdb.d/*.dump; do
      db=$(basename "$f" .dump)
      echo "Restoring seed data into $db from $f"
      pg_restore -U "$POSTGRES_USER" --no-owner --no-privileges -d "$db" "$f"
    done
binaryData:
  novera_auth_db.dump: 
  novera_cart_db.dump: 
  novera_orders.dump: 
  novera_payment_db.dump: 
  productdb.dump: 
