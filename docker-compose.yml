services:
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  authentication-service:
    build: ./authentication-service
    container_name: authentication-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DB_URL: ${AUTH_DB_URL}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCT_DB_URL: ${PRODUCT_DB_URL}
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy

  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CART_DB_URL: jdbc:postgresql://postgres-db:5432/novera_cart_db
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ORDER_DB_URL: jdbc:postgresql://postgres-db:5432/novera_orders
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      CART_SERVICE_URL: ${CART_SERVICE_URL}
    ports:
      - "8083:8083"
    depends_on:
      postgres-db:
        condition: service_healthy

  paymnet-service:
    build: ./paymnet-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      PAYMENT_DB_URL: ${PAYMENT_DB_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
    ports:
      - "8084:8084"
    depends_on:
      postgres-db:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      CART_SERVICE_URL: ${CART_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
    ports:
      - "8085:8085"
    depends_on:
      authentication-service:
        condition: service_started
      product-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      paymnet-service:
        condition: service_started

  frontend:
    build: ./frontend/novera-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway-service:
        condition: service_started

volumes:
  postgres_data:
