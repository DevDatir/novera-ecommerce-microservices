services:
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  authentication-service:
    build: ./authentication-service
    container_name: authentication-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_DB_URL: jdbc:postgresql://postgres-db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
      JWT_SECRET: your-secret-key-here-make-it-long-enough-for-hs256
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PRODUCT_DB_URL: jdbc:postgresql://postgres-db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy

  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CART_DB_URL: jdbc:postgresql://postgres-db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
      PRODUCT_SERVICE_URL: http://product-service:8081
      JWT_SECRET: your-secret-key-here-make-it-long-enough-for-hs256
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDER_DB_URL: jdbc:postgresql://postgres-db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
      AUTH_SERVICE_URL: http://authentication-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      CART_SERVICE_URL: http://cart-service:8082
      JWT_SECRET: your-secret-key-here-make-it-long-enough-for-hs256
    ports:
      - "8083:8083"
    depends_on:
      postgres-db:
        condition: service_healthy

  paymnet-service:
    build: ./paymnet-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PAYMENT_DB_URL: jdbc:postgresql://postgres-db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrey@1029
      ORDER_SERVICE_URL: http://order-service:8083
      JWT_SECRET: your-secret-key-here-make-it-long-enough-for-hs256
      RAZORPAY_KEY_ID: test_key
      RAZORPAY_KEY_SECRET: test_secret
    ports:
      - "8084:8084"
    depends_on:
      postgres-db:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://authentication-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      CART_SERVICE_URL: http://cart-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      JWT_SECRET: your-secret-key-here-make-it-long-enough-for-hs256
    ports:
      - "8085:8085"
    depends_on:
      authentication-service:
        condition: service_started
      product-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      paymnet-service:
        condition: service_started

  frontend:
    build: ./frontend/novera-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway-service:
        condition: service_started

volumes:
  postgres_data:
