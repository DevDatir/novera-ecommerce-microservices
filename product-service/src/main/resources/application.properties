# ===============================
# Application
# ===============================
spring.application.name=product-service

# ===============================
# Server
# ===============================
server.port=8081

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Local observability: Prometheus pulls metrics; the Collector receives traces.
management.opentelemetry.resource-attributes.deployment.environment=local
management.opentelemetry.resource-attributes.service.namespace=novera

management.tracing.sampling.probability=1.0
logging.structured.format.console=logstash
