name: Novera CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ===================================================================
  # 1. PATH FILTERING: Detect which services changed in this commit
  # ===================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      product: ${{ steps.filter.outputs.product }}
      cart: ${{ steps.filter.outputs.cart }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth: 'authentication-service/**'
            product: 'product-service/**'
            cart: 'cart-service/**'
            order: 'order-service/**'
            payment: 'paymnet-service/**'
            gateway: 'gateway-service/**'
            frontend: 'frontend/novera-frontend/**'
            any_changed:
              - 'authentication-service/**'
              - 'product-service/**'
              - 'cart-service/**'
              - 'order-service/**'
              - 'paymnet-service/**'
              - 'gateway-service/**'
              - 'frontend/novera-frontend/**'

  # ===================================================================
  # 2. BUILD & TEST: Compile changed services only
  # ===================================================================
  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Auth Service
        if: ${{ needs.detect-changes.outputs.auth == 'true' }}
        working-directory: ./authentication-service
        run: mvn clean package -DskipTests

      - name: Build Product Service
        if: ${{ needs.detect-changes.outputs.product == 'true' }}
        working-directory: ./product-service
        run: mvn clean package -DskipTests

      - name: Build Cart Service
        if: ${{ needs.detect-changes.outputs.cart == 'true' }}
        working-directory: ./cart-service
        run: mvn clean package -DskipTests

      - name: Build Order Service
        if: ${{ needs.detect-changes.outputs.order == 'true' }}
        working-directory: ./order-service
        run: mvn clean package -DskipTests

      - name: Build Payment Service
        if: ${{ needs.detect-changes.outputs.payment == 'true' }}
        working-directory: ./paymnet-service
        run: mvn clean package -DskipTests

      - name: Build Gateway Service
        if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
        working-directory: ./gateway-service
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/novera-frontend/package-lock.json

      - name: Build Frontend
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        working-directory: ./frontend/novera-frontend
        env:
          VITE_PRODUCT_API: http://localhost
          VITE_AUTH_API: http://localhost
          VITE_CART_API: http://localhost
          VITE_ORDER_API: http://localhost
          VITE_PAYMENT_API: http://localhost
        run: |
          npm ci
          npm run build

  # ===================================================================
  # 3. DOCKER BUILD & PUSH: Incremental Rollover Tagging (0.2.9 -> 0.3.0)
  # ===================================================================
  docker-build-push:
    needs: [detect-changes, build-and-test]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Calculate version tag using Modulo Math
      - name: Calculate Version Tag
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          MINOR=$(( 2 + (RUN_NUM / 10) ))
          PATCH=$(( RUN_NUM % 10 ))
          TAG="0.${MINOR}.${PATCH}"
          
          echo "Generated version tag: $TAG"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build & Push Changed Images Only ---
      - name: Build & Push Frontend Image
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-frontend:${TAG} ./frontend/novera-frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-frontend:${TAG}

      - name: Build & Push Auth Service Image
        if: ${{ needs.detect-changes.outputs.auth == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-auth-service:${TAG} ./authentication-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-auth-service:${TAG}

      - name: Build & Push Product Service Image
        if: ${{ needs.detect-changes.outputs.product == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:${TAG} ./product-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:${TAG}

      - name: Build & Push Cart Service Image
        if: ${{ needs.detect-changes.outputs.cart == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-cart-service:${TAG} ./cart-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-cart-service:${TAG}

      - name: Build & Push Order Service Image
        if: ${{ needs.detect-changes.outputs.order == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-order-service:${TAG} ./order-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-order-service:${TAG}

      - name: Build & Push Payment Service Image
        if: ${{ needs.detect-changes.outputs.payment == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-payment-service:${TAG} ./paymnet-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-payment-service:${TAG}

      - name: Build & Push Gateway Service Image
        if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-gateway-service:${TAG} ./gateway-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/novera-gateway-service:${TAG}

  # ===================================================================
  # 4. DEPLOYMENT: Runs on your Windows Self-Hosted Runner
  # ===================================================================
  deploy-k8s:
    needs: [detect-changes, docker-build-push]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: self-hosted

    # Explicitly use Git Bash on your Windows Laptop runner
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/base/

      - name: Update deployment images in Kubernetes
        run: |
          TAG="${{ needs.docker-build-push.outputs.version_tag }}"
          echo "Updating deployments to tag: ${TAG}"

          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            kubectl set image deployment/novera-frontend-deployment frontend=${{ secrets.DOCKERHUB_USERNAME }}/novera-frontend:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.auth }}" == "true" ]; then
            kubectl set image deployment/novera-auth-deployment auth-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-auth-service:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.product }}" == "true" ]; then
            kubectl set image deployment/novera-product-deployment product-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.cart }}" == "true" ]; then
            kubectl set image deployment/novera-cart-deployment cart-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-cart-service:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.order }}" == "true" ]; then
            kubectl set image deployment/novera-order-deployment order-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-order-service:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.payment }}" == "true" ]; then
            kubectl set image deployment/novera-payment-deployment payment-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-payment-service:${TAG}
          fi

          if [ "${{ needs.detect-changes.outputs.gateway }}" == "true" ]; then
            kubectl set image deployment/novera-gateway-deployment gateway-service=${{ secrets.DOCKERHUB_USERNAME }}/novera-gateway-service:${TAG}
          fi