name: Novera CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Authentication Service
        working-directory: ./authentication-service
        run: mvn clean package -DskipTests

      - name: Build Product Service
        working-directory: ./product-service
        run: mvn clean package -DskipTests

      - name: Build Cart Service
        working-directory: ./cart-service
        run: mvn clean package -DskipTests

      - name: Build Order Service
        working-directory: ./order-service
        run: mvn clean package -DskipTests

      - name: Build Payment Service
        working-directory: ./paymnet-service
        run: mvn clean package -DskipTests

      - name: Build Gateway Service
        working-directory: ./gateway-service
        run: mvn clean package -DskipTests

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Product Service image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:0.2.1 \
            ./product-service
 
      - name: Push Product Service image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:0.2.1