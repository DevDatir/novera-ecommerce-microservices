name: Novera CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------------
  # 1. PATH FILTERING: Detect which services changed in this commit
  # -------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      product: ${{ steps.filter.outputs.product }}
      cart: ${{ steps.filter.outputs.cart }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth: 'authentication-service/**'
            product: 'product-service/**'
            cart: 'cart-service/**'
            order: 'order-service/**'
            payment: 'paymnet-service/**'
            gateway: 'gateway-service/**'
            frontend: 'frontend/novera-frontend/**'
            any_changed:
              - 'authentication-service/**'
              - 'product-service/**'
              - 'cart-service/**'
              - 'order-service/**'
              - 'paymnet-service/**'
              - 'gateway-service/**'
              - 'frontend/novera-frontend/**'

  # -------------------------------------------------------------------
  # 2. BUILD & TEST: Only run for services that changed
  # -------------------------------------------------------------------
  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Auth Service
        if: ${{ needs.detect-changes.outputs.auth == 'true' }}
        working-directory: ./authentication-service
        run: mvn clean package -DskipTests

      - name: Build Product Service
        if: ${{ needs.detect-changes.outputs.product == 'true' }}
        working-directory: ./product-service
        run: mvn clean package -DskipTests

      - name: Build Cart Service
        if: ${{ needs.detect-changes.outputs.cart == 'true' }}
        working-directory: ./cart-service
        run: mvn clean package -DskipTests

      - name: Build Order Service
        if: ${{ needs.detect-changes.outputs.order == 'true' }}
        working-directory: ./order-service
        run: mvn clean package -DskipTests

      - name: Build Payment Service
        if: ${{ needs.detect-changes.outputs.payment == 'true' }}
        working-directory: ./paymnet-service
        run: mvn clean package -DskipTests

      - name: Build Gateway Service
        if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
        working-directory: ./gateway-service
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/novera-frontend/package-lock.json

      - name: Build Frontend
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        working-directory: ./frontend/novera-frontend
        env:
          VITE_PRODUCT_API: http://localhost
          VITE_AUTH_API: http://localhost
          VITE_CART_API: http://localhost
          VITE_ORDER_API: http://localhost
          VITE_PAYMENT_API: http://localhost
        run: |
          npm ci
          npm run build

  # -------------------------------------------------------------------
  # 3. DOCKER BUILD & PUSH: Incremental versioning & selective build
  # -------------------------------------------------------------------
  docker-build-push:
    needs: [detect-changes, build-and-test]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Helper script to auto-increment SemVer (0.2.2 -> 0.2.3, 0.2.9 -> 0.3.0)
      - name: Define Tag Incrementor Function
        run: |
          increment_version() {
            local image_name=$1
            local default_version="0.2.0"
            
            # Fetch current tags from Docker Hub API
            TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'"${{ secrets.DOCKERHUB_USERNAME }}"'", "password": "'"${{ secrets.DOCKERHUB_TOKEN }}"'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
            LATEST_TAG=$(curl -s -H "Authorization: JWT ${TOKEN}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${image_name}/tags/?page_size=100" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "$default_version"
              return
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            
            # Increment logic: if patch is 9, rollover to minor (0.2.9 -> 0.3.0)
            if [ "$PATCH" -eq 9 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            echo "${MAJOR}.${MINOR}.${PATCH}"
          }
          
          # Export function so subshells can use it
          declare -f increment_version > version_helper.sh

      # --- Frontend ---
      - name: Build & Push Frontend
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-frontend")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-frontend:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./frontend/novera-frontend
          docker push $IMAGE
          echo "FRONTEND_TAG=${TAG}" >> $GITHUB_ENV

      # --- Auth Service ---
      - name: Build & Push Auth Service
        if: ${{ needs.detect-changes.outputs.auth == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-auth-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-auth-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./authentication-service
          docker push $IMAGE

      # --- Product Service ---
      - name: Build & Push Product Service
        if: ${{ needs.detect-changes.outputs.product == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-product-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-product-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./product-service
          docker push $IMAGE

      # --- Cart Service ---
      - name: Build & Push Cart Service
        if: ${{ needs.detect-changes.outputs.cart == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-cart-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-cart-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./cart-service
          docker push $IMAGE

      # --- Order Service ---
      - name: Build & Push Order Service
        if: ${{ needs.detect-changes.outputs.order == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-order-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-order-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./order-service
          docker push $IMAGE

      # --- Payment Service ---
      - name: Build & Push Payment Service
        if: ${{ needs.detect-changes.outputs.payment == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-payment-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-payment-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./paymnet-service
          docker push $IMAGE

      # --- Gateway Service ---
      - name: Build & Push Gateway Service
        if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
        run: |
          source version_helper.sh
          TAG=$(increment_version "novera-gateway-service")
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/novera-gateway-service:${TAG}"
          echo "Building $IMAGE"
          docker build -t $IMAGE ./gateway-service
          docker push $IMAGE

  # -------------------------------------------------------------------
  # 4. DEPLOYMENT: Runs on your SELF-HOSTED RUNNER connected to Kubernetes
  # -------------------------------------------------------------------
  deploy-k8s:
    needs: [detect-changes, docker-build-push]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: self-hosted  # Target your self-hosted runner machine

    # Set default shell to bash for all steps in this job on Windows
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Verify kubectl connection
        run: |
          kubectl cluster-info

      - name: Apply Kubernetes Manifests
        run: |
          # Apply all manifest files in your k8s directory
          kubectl apply -f k8s/base

          # Optionally restart deployments to pick up new images if using latest/matching tags
          # kubectl rollout restart deployment -n default