name: Novera CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: novera-main-image-release
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      product: ${{ steps.filter.outputs.product }}
      cart: ${{ steps.filter.outputs.cart }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth: 'authentication-service/**'
            product: 'product-service/**'
            cart: 'cart-service/**'
            order: 'order-service/**'
            payment: 'paymnet-service/**'
            gateway: 'gateway-service/**'
            frontend: 'frontend/novera-frontend/**'
            any_changed:
              - 'authentication-service/**'
              - 'product-service/**'
              - 'cart-service/**'
              - 'order-service/**'
              - 'paymnet-service/**'
              - 'gateway-service/**'
              - 'frontend/novera-frontend/**'

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - if: needs.detect-changes.outputs.auth == 'true'
        run: mvn -B -f authentication-service/pom.xml test
      - if: needs.detect-changes.outputs.product == 'true'
        run: mvn -B -f product-service/pom.xml test
      - if: needs.detect-changes.outputs.cart == 'true'
        run: mvn -B -f cart-service/pom.xml test
      - if: needs.detect-changes.outputs.order == 'true'
        run: mvn -B -f order-service/pom.xml test
      - if: needs.detect-changes.outputs.payment == 'true'
        run: mvn -B -f paymnet-service/pom.xml test
      - if: needs.detect-changes.outputs.gateway == 'true'
        run: mvn -B -f gateway-service/pom.xml test

      - if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/novera-frontend/package-lock.json

      - if: needs.detect-changes.outputs.frontend == 'true'
        working-directory: frontend/novera-frontend
        run: |
          npm ci
          npm run build

  build-push:
    needs: [detect-changes, test]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push changed images
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          AUTH_CHANGED: ${{ needs.detect-changes.outputs.auth }}
          PRODUCT_CHANGED: ${{ needs.detect-changes.outputs.product }}
          CART_CHANGED: ${{ needs.detect-changes.outputs.cart }}
          ORDER_CHANGED: ${{ needs.detect-changes.outputs.order }}
          PAYMENT_CHANGED: ${{ needs.detect-changes.outputs.payment }}
          GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.gateway }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          echo '[]' > image-versions.json

          next_tag() {
            local image="$1"
            local latest
            latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/$DOCKER_USER/$image/tags?page_size=100" \
              | jq -r '.results[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true)

            if [ -z "$latest" ]; then
              echo '0.0.1'
              return
            fi

            IFS=. read -r major minor patch <<< "$latest"
            if [ "$patch" -ge 9 ]; then
              echo "$major.$((minor + 1)).0"
            else
              echo "$major.$minor.$((patch + 1))"
            fi
          }

          publish() {
            local deployment="$1"
            local image="$2"
            local context="$3"
            local tag
            tag=$(next_tag "$image")
            echo "Publishing $image:$tag"
            docker build -t "$DOCKER_USER/$image:$tag" "$context"
            docker push "$DOCKER_USER/$image:$tag"
            jq --arg deployment "$deployment" --arg image "$image" --arg tag "$tag" \
              '. + [{deployment: $deployment, image: $image, tag: $tag}]' \
              image-versions.json > image-versions.tmp
            mv image-versions.tmp image-versions.json
          }

          [ "$AUTH_CHANGED" = true ] && publish authentication-service novera-auth-service authentication-service
          [ "$PRODUCT_CHANGED" = true ] && publish product-service novera-product-service product-service
          [ "$CART_CHANGED" = true ] && publish cart-service novera-cart-service cart-service
          [ "$ORDER_CHANGED" = true ] && publish order-service novera-order-service order-service
          [ "$PAYMENT_CHANGED" = true ] && publish payment-service novera-payment-service paymnet-service
          [ "$GATEWAY_CHANGED" = true ] && publish gateway-service novera-gateway-service gateway-service
          [ "$FRONTEND_CHANGED" = true ] && publish frontend novera-frontend frontend/novera-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: image-versions
          path: image-versions.json

  deploy-k8s:
    needs: [detect-changes, build-push]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-versions

      - name: Deploy changed images
        shell: powershell
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $images = Get-Content image-versions.json | ConvertFrom-Json

          foreach ($image in $images) {
            kubectl set image "deployment/$($image.deployment)" "$($image.deployment)=$env:DOCKER_USER/$($image.image):$($image.tag)" -n novera
            kubectl rollout status "deployment/$($image.deployment)" -n novera --timeout=180s
          }
